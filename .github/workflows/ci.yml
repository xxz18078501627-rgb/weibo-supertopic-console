name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node --test tests/service.test.js
      - run: node tests/windows-install.smoke.mjs
      - run: node tests/windows-install.smoke.mjs
        env:
          WEIBO_CONSOLE_SERVICE_MODE: startup

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
        env:
          WEIBO_CONSOLE_LICENSE: 'off'
      - name: UI E2E
        if: runner.os == 'macOS'
        run: npm run test:e2e
      - name: 工作台验证契约与转赞评验证隔离
        run: node --test --test-name-pattern='工作台浏览器验证契约|engage 抛出 VerificationError|点赞验证码' tests/verification.test.js tests/engage-session.test.js tests/engage.test.js
        env:
          WEIBO_CONSOLE_LICENSE: 'off'
