name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node --test tests/service.test.js
      - run: node tests/windows-install.smoke.mjs
      - run: node tests/windows-install.smoke.mjs
        env:
          WEIBO_CONSOLE_SERVICE_MODE: startup

  test:
    strategy:
      fail-fast: false
      matrix:
        # 只跑 macOS。Windows runner 历史上容易抖（临时目录清理、等待时间），
        # 见 8a662c9 / 42d84b6。需要临时验证 Windows 时，把 windows-latest 加回列表即可。
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
        env:
          WEIBO_CONSOLE_LICENSE: 'off'
