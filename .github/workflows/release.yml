name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: mac-x64
          - os: macos-15
            platform: mac-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install chromium
      - if: matrix.platform == 'windows-x64'
        run: choco install innosetup --yes --no-progress
      - name: Test release candidate
        shell: bash
        env:
          WEIBO_CONSOLE_LICENSE: 'off'
        run: npm test
      - name: UI end-to-end tests
        if: matrix.platform == 'mac-arm64'
        shell: bash
        env:
          WEIBO_CONSOLE_LICENSE: 'off'
        run: npm run test:e2e
      - name: Build platform package
        shell: bash
        run: node scripts/build-platform-package.mjs --platform "${{ matrix.platform }}"
      - name: Install, update and roll back native Windows EXE
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: node tests/platform-installer.smoke.mjs
      - name: Sign and notarize macOS DMG
        if: matrix.platform != 'windows-x64'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12_BASE64" || -z "$MACOS_CERT_PASSWORD" || -z "$APPLE_SIGN_IDENTITY" || -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" ]]; then
            echo "Signing secrets are not configured; keeping this release unsigned."
            exit 0
          fi
          cert="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="${MACOS_KEYCHAIN_PASSWORD:-release-$RANDOM-$RANDOM}"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 -D > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          for dmg in dist/platform/${{ matrix.platform }}/*.dmg; do
            codesign --force --timestamp --sign "$APPLE_SIGN_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          done
      - name: Sign Windows installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Host 'Signing secrets are not configured; keeping this release unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'authenticode.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw 'signtool.exe not found' }
          Get-ChildItem 'dist/platform/windows-x64/*.exe' | ForEach-Object {
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($_.FullName)" }
          }
      - name: Refresh installer checksum in manifest
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const dir = path.join('dist', 'platform', process.env.PLATFORM);
          for (const name of fs.readdirSync(dir).filter(name => name.endsWith('.manifest.json'))) {
            const file = path.join(dir, name);
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
            const installer = path.join(dir, manifest.installerFile);
            if (!fs.existsSync(installer)) throw new Error(`Missing installer ${installer}`);
            const bytes = fs.readFileSync(installer);
            manifest.installerSha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            manifest.installerSize = bytes.length;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2));
          }
          NODE
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/platform/${{ matrix.platform }}/*.manifest.json
            dist/platform/${{ matrix.platform }}/*-update.zip
            dist/platform/${{ matrix.platform }}/*.dmg
            dist/platform/${{ matrix.platform }}/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'mac-arm64'
        with:
          name: docs-and-transition
          path: |
            dist/weibo-console-*.zip
            dist/weibo-console-*.manifest.json
            docs/手动安装与更新-Mac.md
            docs/手动安装与更新-Windows.md
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: docs-and-transition
          path: release-assets
          merge-multiple: true
      - name: Normalize guide filenames
        shell: bash
        run: |
          mv "release-assets/docs/手动安装与更新-Mac.md" "release-assets/Manual-Install-Update-Mac.md"
          mv "release-assets/docs/手动安装与更新-Windows.md" "release-assets/Manual-Install-Update-Windows.md"
          rmdir release-assets/docs
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$VERSION"; fi
          if [[ "$TAG" != "v$VERSION" ]]; then echo "Tag $TAG does not match package version v$VERSION"; exit 1; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "制饼工坊 $TAG" --notes-file CHANGELOG.md
          find release-assets -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
